# Backup notturno del database Supabase.
# Serve il segreto SUPABASE_DB_URL (Settings → Secrets and variables → Actions):
# la stringa «Session pooler» di Supabase (pulsante Connect), con la password del database.
name: Backup notturno

on:
  schedule:
    - cron: "17 1 * * *"   # ogni notte alle 2:17 (ora italiana d'inverno)
  workflow_dispatch: {}    # e a mano, dal pulsante «Run workflow»

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Installa pg_dump
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-18 >/dev/null
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Copia del database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Scompone l'indirizzo in host, porta, utente e password senza mai stamparlo
          python3 - <<'PY'
          import os, re, sys, urllib.parse as u
          s = re.sub(r"\s+", "", os.environ.get("DB_URL", ""))
          m = re.match(r"^postgres(?:ql)?://([^:]+):(.*)@([^@/:]+):(\d+)/([^?]*)", s)
          if not m:
              print("::error::Il segreto SUPABASE_DB_URL non ha la forma postgresql://utente:password@host:porta/postgres", file=sys.stdout)
              sys.exit(1)
          utente, pw, host, porta, db = m.groups()
          pw = u.unquote(pw)
          if pw.startswith("[") and pw.endswith("]"):
              print("::error::Nel segreto ci sono ancora le parentesi quadre intorno alla password", file=sys.stdout)
              sys.exit(1)
          print(f"::add-mask::{pw}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in dict(PGHOST=host, PGPORT=porta, PGUSER=utente, PGPASSWORD=pw, PGDATABASE=db or "postgres").items():
                  f.write(f"{k}={v}\n")
          PY

      - name: Esporta
        run: |
          D=/usr/lib/postgresql/18/bin
          mkdir backup
          # Copia completa, da ripristinare con pg_restore
          $D/pg_dump -Fc --no-owner --no-privileges -n public -n auth -n storage -f backup/gestionale.dump
          # Copia leggibile dei soli dati del gestionale
          $D/pg_dump --data-only --no-owner -n public -f backup/dati_gestionale.sql
          ls -la backup
          echo "GIORNO=$(TZ=Europe/Rome date +%F)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.GIORNO }}
          path: backup/
          retention-days: 30

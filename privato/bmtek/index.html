 <div class="panel"><h2>Costi annui dell’azienda</h2><div class="g">${F('pers','Costo personale annuo €')}${F('fissi','Costi fissi annui €')}${F('nper','Persone')}${F('oreM','Ore mensili per persona')}${F('mesi','Mesi produttivi')}${F('ref','Costo base di riferimento della macchina standard €')}</div></div>

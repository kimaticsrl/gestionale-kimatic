function whoOf(w){

function buildLoad(){

 const L=new Map();
 allPh().forEach(x=>{if(isOff(x.code))return;
  if(isDone(x.p))return;const sp=span(x.p);if(!sp||!sp.full)return;
  const ws=[];for(let d=sp.s;d<=sp.e;d++)if(isWork(d))ws.push(d);if(!ws.length)ws.push(sp.s);
  const base=x.p.h?x.p.h/ws.length:8;
  ws.forEach(d=>{const names=whoOnDay(x.p,d);if(!names.length)return;const hpd=base/names.length;
   names.forEach(n=>{let m=L.get(n.id);if(!m){m=new Map();L.set(n.id,m)}
    let c=m.get(d);if(!c){c={h:0,items:[]};m.set(d,c)}c.h+=hpd;c.items.push({x,h:hpd})})});
 });

  let m=L.get(per.id);if(!m){m=new Map();L.set(per.id,m)}
  let c=m.get(d);if(!c){c={h:0,items:[]};m.set(d,c)}
  if(!c.blk){c.blk=n;c.h+=8*(per.cap||1)}});

}
const noAtt=per=>per&&per.att===false;

function unav(per,d){if(!per)return'';if(per.att===false)return'non più in azienda';const f=d2n(per.fine);if(f!=null&&d>f)return'non disponibile dal '+fm(f+1);return''}

 return out}
const shiftP=(p,dl)=>{const o={};if(p.s)o.s=n2s(d2n(p.s)+dl);if(p.e)o.e=n2s(d2n(p.e)+dl);return o};
function analyze(){

  else if(isStale(p,x.code)){const dl=TODAY-d2n(p.e);A.push({k:'Da chiudere',x,days:dl,msg:`Fine prevista ${fmt(d2n(p.e))}, ${dl} giorni fa. Non è segnata come completata: probabilmente è già stata fatta`})}

  if(!isOff(x.code)&&!p.auto&&!isDone(p)&&!String(p.w||'').trim()&&!(p.t&&p.t.length)&&(!sp||sp.e>=TODAY)){const ds=sp?sp.s-TODAY:0;A.push({k:'Non assegnata',sub:'assegnatario',x,days:0,start:sp?sp.s:1e9,msg:'Nessun assegnatario: '+(!sp?'fase senza date':sp.s<=TODAY?'attività in corso':'parte il '+fmt(sp.s)+' (tra '+ds+' gg)')+(sp&&!sp.full?' · date incomplete':'')})}
  if(p.st==='d'&&!isDone(p)&&sp&&sp.e>=TODAY){const ds=sp.s-TODAY;A.push({k:'Da confermare',x,days:0,start:sp.s,msg:'Risorsa e date ancora da confermare'+(isOff(x.code)?'':' ('+(String(p.w||'').trim()||'nessun assegnatario')+')')+': '+(sp.s<=TODAY?'attività già iniziata':'parte il '+fmt(sp.s)+' (tra '+ds+' gg)')})}
  const allow=PHD[x.code].allow;

 });
 S.commesse.forEach(c=>{if(c.chiusa)return;
  const ms=IDX.byLine[c.id]||[],tds=c.common?.['1A'],tE=tds&&tds.e?d2n(tds.e):null;
  if(tE!=null)ms.forEach(m=>['1B-M','1B-E'].forEach(code=>{const p=m.phases?.[code];if(!p||isDone(p))return;const sp=span(p);

   if(sp&&sp.s<min)A.push({k:'Criticità',sub:'dipendenza',x:{c,m,code:cd,p,key:m.id+'|'+cd},msg:`${msg} (${fmt(qe)})`,ops:[{kind:'macchine',id:m.id,code:cd,patch:shiftP(p,min-sp.s)}],opl:`Sposta l'inizio a ${fm(min)}`})}));
  [['5A','4B','L\'imballaggio e carico linea parte prima del F.A.T.'],['5B','5A','L\'installazione linea parte prima della fine di imballaggio e carico']].forEach(([cd,pre,msg])=>{
   const p=c.common?.[cd],q=c.common?.[pre];if(!p||isDone(p)||!q||!q.e)return;const sp=span(p),qe=d2n(q.e);

  const p4=c.common?.['4A'];

function jpegPdf(jp,w,h){
 const W=842,H=595,m=28,k=Math.min((W-2*m)/w,(H-2*m)/h),iw=(w*k).toFixed(2),ih=(h*k).toFixed(2),ix=((W-w*k)/2).toFixed(2),iy=(H-h*k-0).toFixed(2)>0?((H-h*k)/2).toFixed(2):'0';
 const enc=t=>new TextEncoder().encode(t),parts=[],off=[];let len=0;
 const put=b=>{const u=typeof b==='string'?enc(b):b;parts.push(u);len+=u.length};
 put('%PDF-1.4\n');
 const obj=(n,body)=>{off[n]=len;put(`${n} 0 obj\n`);body.forEach(put);put('\nendobj\n')};
 obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);obj(2,['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
 obj(3,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
 obj(4,[`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jp.length} >>\nstream\n`,jp,'\nendstream']);
 const cs=`q ${iw} 0 0 ${ih} ${ix} ${iy} cm /Im0 Do Q`;obj(5,[`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`]);
 const xr=len;put('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)put(String(off[i]).padStart(10,'0')+' 00000 n \n');
 put(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
 const out=new Uint8Array(len);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length});return out;
}

function stdMatch(m){

function stdHours(t,ext){
 const n=x=>Number(t[x])||0;
 return{'3A':n('prep'),'3B':ext?(n('emm')||n('mm'))+(n('epn')||n('pn')):n('mm')+n('pn'),'3C-Q':n('qe'),'3C-B':n('be')}}
const isExt=w=>whoOf(w).some(n=>n.team==='Esterni montaggio');
function stdPlan(){
 const rows=[];
 vis().forEach(c=>(IDX.byLine[c.id]||[]).forEach(m=>{
  const t=stdMatch(m),ph=m.phases||{};
  if(!t){rows.push({c,m,t:null,fill:[],cells:{}});return}
  const cells={},fill=[];
  STDP.forEach(([code])=>{const p=ph[code];if(!p||!Object.keys(p).length){cells[code]=null;return}
   const ext=code==='3B'&&isExt(p.w),h=stdHours(t,ext)[code];
   cells[code]={std:h,cur:Number(p.h)||0,ext,done:!!p.done};
   if(h>0&&!(Number(p.h)>0)&&!p.done)fill.push({kind:'macchine',id:m.id,code,patch:{h}})});
  rows.push({c,m,t,fill,cells})}));
 return rows}

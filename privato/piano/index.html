function itHol(n){const t=new Date(n*864e5),y=t.getUTCFullYear();let M=_hol.get(y);if(!M){M=new Map();[[0,1,'Capodanno'],[0,6,'Epifania'],[3,25,'Festa della Liberazione'],[4,1,'Festa dei lavoratori'],[5,2,'Festa della Repubblica'],[7,15,'Ferragosto'],[10,1,'Ognissanti'],[11,8,'Immacolata Concezione'],[11,25,'Natale'],[11,26,'Santo Stefano']].forEach(([m,d,nm])=>M.set(Date.UTC(y,m,d)/864e5,nm));M.set(_eas(y)+1,"Lunedì dell'Angelo");_hol.set(y,M)}return M.get(n)||''}

 });

}

let FZL=[];
function analyze(){

function jpegPdf(jp,w,h){
 const W=842,H=595,m=28,k=Math.min((W-2*m)/w,(H-2*m)/h),iw=(w*k).toFixed(2),ih=(h*k).toFixed(2),ix=((W-w*k)/2).toFixed(2),iy=(H-h*k-0).toFixed(2)>0?((H-h*k)/2).toFixed(2):'0';
 const enc=t=>new TextEncoder().encode(t),parts=[],off=[];let len=0;
 const put=b=>{const u=typeof b==='string'?enc(b):b;parts.push(u);len+=u.length};
 put('%PDF-1.4\n');
 const obj=(n,body)=>{off[n]=len;put(`${n} 0 obj\n`);body.forEach(put);put('\nendobj\n')};
 obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);obj(2,['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
 obj(3,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
 obj(4,[`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jp.length} >>\nstream\n`,jp,'\nendstream']);
 const cs=`q ${iw} 0 0 ${ih} ${ix} ${iy} cm /Im0 Do Q`;obj(5,[`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`]);
 const xr=len;put('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)put(String(off[i]).padStart(10,'0')+' 00000 n \n');
 put(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
 const out=new Uint8Array(len);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length});return out;
}

/* ===== Backup automatico: 2 volte al giorno (mattina/pomeriggio), ultimi 7 giorni ===== */
const BK_KEEP=14,BK_CH=90000,BK_COLS=['commesse','macchine','persone','agenda','tempi','ore'];
let BKS=[],bkBusy=false;const bkLoaded={};
const bkSlot=()=>{const n=new Date(),p=x=>String(x).padStart(2,'0');return ''+n.getFullYear()+p(n.getMonth()+1)+p(n.getDate())+(n.getHours()<13?'a':'p')};
const bkLabel=id=>id.slice(6,8)+'/'+id.slice(4,6)+'/'+id.slice(0,4)+(id[8]==='a'?' mattina':' pomeriggio');
async function bkRun(force){
 if(bkBusy||RO()||!BK_COLS.every(c=>bkLoaded[c])||!S.macchine.length)return;
 const slot=bkSlot();if(!force&&BKS.some(b=>b.id===slot))return;
 bkBusy=true;
 try{
  if(!force){const ex=await db.doc('backup/'+slot).get();if(ex.exists)return}
  const cnt={},chs={};
  for(const c of BK_COLS){const js=JSON.stringify(S[c]),parts=[];for(let i=0;i<js.length||!i;i+=BK_CH)parts.push(js.slice(i,i+BK_CH));cnt[c]=S[c].length;chs[c]=parts.length;
   for(let i=0;i<parts.length;i++)await db.doc('backup/'+slot+'/c/'+c+'_'+i).set({j:parts[i]})}
  await db.doc('backup/'+slot).set({ts:Date.now(),cnt,chs});
  const old=BKS.filter(b=>b.id!==slot).sort((a,b)=>a.id<b.id?1:-1).slice(BK_KEEP-1);
  for(const b of old){for(const c of BK_COLS)for(let i=0;i<(b.chs&&b.chs[c]||0);i++)await db.doc('backup/'+b.id+'/c/'+c+'_'+i).delete();await db.doc('backup/'+b.id).delete()}
  if(force)toast('Backup salvato')
 }catch(e){console.warn('backup',e);if(force)toast('Errore backup: '+(e.code||e.message))}finally{bkBusy=false}}
async function bkRead(id){const b=BKS.find(x=>x.id===id);if(!b)return null;const out={};
 for(const c of BK_COLS){let js='';for(let i=0;i<(b.chs[c]||0);i++){const s=await db.doc('backup/'+id+'/c/'+c+'_'+i).get();if(!s.exists)throw new Error('backup incompleto');js+=s.data().j}out[c]=JSON.parse(js||'[]')}return out}
async function bkDownload(id){const d=await claude.use('downloads');if(!d)return toast('Download non disponibile');
 try{const j=await bkRead(id);await d.save({filename:'backup-'+id+'.json',data:JSON.stringify(j,null,1)})}catch(e){toast('Errore: '+(e.code||e.message))}}
async function bkRestore(id){if(!canWrite())return;
 try{const j=await bkRead(id);if(!j)return;let n=0;const miss=[];
  for(const c of BK_COLS)for(const x of j[c]||[])if(!(S[c]||[]).some(y=>y.id===x.id))miss.push([c,x]);
  if(!miss.length)return toast('Nessun elemento eliminato rispetto a questo backup');
  if(!cf('rb'+id,'Ripristinare '+miss.length+' elementi eliminati dopo il backup del '+bkLabel(id)+'? Gli elementi esistenti non vengono toccati.'))return;
  for(const [c,x] of miss){const {id:i,...r}=x;await db.doc(c+'/'+i).set(r);n++}toast(n+' elementi ripristinati')}catch(e){toast('Errore: '+(e.code||e.message))}}

 return `<h2>Da implementare</h2><p class="tag">Appunti personali su quello che c'è da fare: li vedi solo tu e non sono condivisi con nessun altro. ${it.length?ap+' da fare · '+(it.length-ap)+' fatti':''}</p>
 <div class="bar"><input id="todo-new" placeholder="Nuovo appunto…" style="flex:1;min-width:260px"><button class="pri" data-act="todoadd">Aggiungi</button></div>
 <div class="scroll dt"><table><thead><tr><th style="width:44px">Fatto</th><th>Appunto</th><th style="width:44px"></th></tr></thead><tbody>${it.length?it.map(x=>`<tr style="${x.d?'opacity:.55':''}"><td style="text-align:center"><input type="checkbox" data-todod="${x.id}" ${x.d?'checked':''} aria-label="Fatto"></td><td><textarea data-todot="${x.id}" rows="${Math.min(6,Math.max(1,Math.ceil(String(x.t||'').length/90)))}" style="width:100%;min-width:300px;${x.d?'text-decoration:line-through':''}">${esc(x.t||'')}</textarea></td><td><button data-act="tododel" data-id="${x.id}" aria-label="Elimina">✕</button></td></tr>`).join(''):'<tr><td colspan="3" class="tag">Nessun appunto.</td></tr>'}</tbody></table></div>`}
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(!d||!TODO)return;
 if(d.todod!=null&&TODO.items[d.todod]){TODO.items[d.todod].d=t.checked?1:0;todoSave();render()}
 else if(d.todot!=null&&TODO.items[d.todot]){const v=t.value.trim();if(v)TODO.items[d.todot].t=v;todoSave();render()}});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='todo-new'&&e.key==='Enter'){e.preventDefault();todoAdd()}});
function todoAdd(){const i=$('#todo-new'),v=(i&&i.value||'').trim();if(!v)return;TODO.items['n'+Date.now().toString(36)]={t:v,d:0,c:Date.now()};todoSave();render()}
function vReg(){
 const us=[...new Set(LOGS.map(x=>x.u||'?'))],nm=u=>LN(u);
 const q=(UI.rgq||'').toLowerCase().trim();
 let L=LOGS.filter(x=>(!UI.rgu||(x.u||'?')===UI.rgu)&&(!UI.rgk||x.k===UI.rgk)&&(!q||(nm(x.u)+' '+(x.l||'')+' '+(x.s||'')+' '+(x.c||'')+' '+(x.tabs||[]).join(' ')).toLowerCase().includes(q)));
 const tot=L.length;L=L.slice(0,500);
 return `<div class="card"><h2 style="margin:0 0 6px">Registro attività</h2><p class="muted" style="margin:0 0 8px;font-size:12px">Visibile solo al titolare. Registra le modifiche fatte dagli utenti che possono modificare e le aperture dell'app (con le schede visitate). Non registra chi può solo visualizzare, né le modifiche automatiche. Le voci più vecchie di 120 giorni vengono eliminate.</p>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><select data-sel="rgu"><option value="">Tutti gli utenti</option>${us.map(u=>`<option value="${esc(u)}" ${UI.rgu===u?'selected':''}>${esc(nm(u))}</option>`).join('')}</select>
 <select data-sel="rgk"><option value="">Modifiche e aperture</option><option value="m" ${UI.rgk==='m'?'selected':''}>Solo modifiche</option><option value="a" ${UI.rgk==='a'?'selected':''}>Solo aperture</option></select>
 <input data-sel="rgq" value="${esc(UI.rgq||'')}" placeholder="Cerca (poi Invio)" style="min-width:180px"><span class="muted" style="font-size:12px">${tot} voci${tot>500?' (mostrate le ultime 500)':''}</span></div>${LGERR?`<p class="tag" style="color:var(--bad,#c0392b)">${esc(LGERR)}</p>`:!OWN?'<p class="tag">Il registro è visibile solo al titolare dell\'artefatto.</p>':!LGPRIV?'<p class="tag" style="color:var(--bad,#c0392b)">Chiave di decifratura non disponibile in questa vista: riapri la pagina dal tuo account titolare.</p>':LGN0>0&&!LOGS.length?'<p class="tag">Decifrazione delle voci in corso…</p>':''}
 <div style="overflow:auto"><table class="tb" style="width:100%;font-size:12.5px"><thead><tr><th>Quando</th><th>Utente</th><th>Cosa</th><th>Dettaglio</th></tr></thead><tbody>${L.map(x=>x.k==='a'?`<tr><td>${lgFmt(x.t)}</td><td>${esc(nm(x.u))}</td><td>Apertura app</td><td>${x.e&&x.e-x.t>60000?'attivo ~'+Math.round((x.e-x.t)/60000)+' min · ':''}schede: ${esc((x.tabs||[]).join(', '))}</td></tr>`:`<tr><td>${lgFmt(x.t)}</td><td>${esc(nm(x.u))}</td><td>${esc(LOGC[x.c]||x.c)} · ${esc(x.l||x.i)}</td><td>${esc(x.s||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Nessuna voce</td></tr>'}</tbody></table></div></div>`}
function LN(u){return !u?'(sconosciuto)':(LOGN[u]||'Utente '+String(u).slice(-4))}
async function lgNames(u){const ids=[...new Set(LOGS.map(x=>x.u).filter(Boolean))].filter(i=>!LOGN[i]);if(!ids.length||!u||!u.profiles)return;try{const ps=await u.profiles(ids.slice(0,64));for(const i of ids)if(ps&&ps[i]&&ps[i].name)LOGN[i]=ps[i].name;if(UI.tab==='reg')schedule()}catch(e){}}
let lgBusy=false,lgAgain=null;
async function lgDecAll(docs,u){if(lgBusy){lgAgain=[docs,u];return}lgBusy=true;try{const out=[];let n=0;
 for(const d of docs){const dd=d.data();if(!dd.x||!LGPRIV)continue;const key=d.id+'|'+dd.x.d;let o=LGC.get(key);
  if(!o){try{o=await lgDec(dd.x)}catch(e){o=null}if(o)LGC.set(key,o)}
  if(o)out.push({id:d.id,...o});if(++n%25===0){LOGS=out.slice().sort((x,y)=>(y.t||0)-(x.t||0));if(UI.tab==='reg')schedule()}}
 LOGS=out.sort((x,y)=>(y.t||0)-(x.t||0));lgNames(u);if(UI.tab==='reg')schedule()}finally{lgBusy=false;if(lgAgain){const a=lgAgain;lgAgain=null;lgDecAll(a[0],a[1])}}}
async function lgStart(u){await lgKeys();
 LOGON=true;logTab(UI.tab);
 if(!OWN||!RAW)return;
 try{RAW.collection('log').orderBy('t','desc').limit(1000).onSnapshot(s=>{LGERR='';LGN0=s.docs.length;lgDecAll(s.docs,u)},e=>{LGERR='lettura non riuscita ('+(e&&(e.code||e.message)||'errore')+')';if(UI.tab==='reg')schedule()})}catch(e){LGERR='lettura non riuscita ('+(e&&(e.code||e.message)||'errore')+')'}
 try{const cut=Date.now()-120*864e5;let un=null,done=false;un=RAW.collection('log').orderBy('t','asc').limit(40).onSnapshot(s=>{if(done)return;done=true;s.docs.forEach(d=>{const x=d.data();if(x.t<cut)RAW.doc('log/'+d.id).delete().catch(()=>{})});try{un&&un()}catch(e){}},e=>{})}catch(e){}}

/* ===================== dati condivisi ===================== */
(async()=>{
 render();
 db=await claude.use('db');
 if(db){RAW=db;db=wrapDb(RAW)}
 let u=null;try{u=await claude.use('user')}catch(e){}
 if(u&&u.can&&u.can('data.write')===false)canW=false;
 if(!canW&&UI.tab!=='op'){UI.tab='op';render()}
 USR=u;
 try{ADM=!!(u&&u.canEdit&&await u.canEdit())}catch(e){ADM=false}
 try{UID=u&&u.id?await u.id():null}catch(e){UID=null}
 try{OWN=!!(u&&u.isOwner&&await u.isOwner())}catch(e){OWN=false}
 render();
 const st=$('#st');
 if(!db){st.textContent='dati condivisi non disponibili in questa vista';return}
 todoInit();
 st.textContent=canW?'sincronizzato · modifiche condivise':'sola lettura';stRole();
 let bkT=null,bkFirst=false;function bkSoon(){if(!bkFirst)return;clearTimeout(bkT);bkT=setTimeout(()=>bkRun(false),4000+Math.random()*4000)}
 ['commesse','macchine','persone','agenda','tempi','tv','ore','link','preliminari','config','accessi'].forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));VER++;reindex();schedule();if(BK_COLS.includes(c)){bkLoaded[c]=1;bkSoon()}},e=>{st.textContent='errore dati: '+e.code}));
 db.collection('backup').onSnapshot(s=>{BKS=s.docs.map(d=>({id:d.id,...d.data()})).filter(b=>/^\d{8}[ap]$/.test(b.id)&&b.chs);bkFirst=true;bkSoon();if(UI.tab==='dati')schedule()},e=>{});
 setInterval(()=>bkSoon(),30*60*1000);
 lgStart(u);
 /* i costi sono ora in un artifact separato: se sei il titolare, elimina eventuali residui da questo database */
 if(OWN&&RAW){try{let un=null,dn=false;un=RAW.collection('costi').onSnapshot(s=>{if(dn)return;dn=true;s.docs.forEach(d=>RAW.doc('costi/'+d.id).delete().catch(()=>{}));try{un&&un()}catch(e){}},e=>{})}catch(e){}}
})();
</script>
